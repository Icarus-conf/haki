name: Feature request
description: Suggest an idea for Haki
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How could Haki solve it? Sketches welcome.
  - type: textarea
    id: privacy
    attributes:
      label: Privacy impact
      description: Would the server need to see anything new? Haki aims to keep content end-to-end encrypted.
