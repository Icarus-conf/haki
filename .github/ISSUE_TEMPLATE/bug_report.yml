name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: For security problems, don't use this form. See SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a group chat
        2. Send a photo
        3. ...
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Which part
      options: [App, Backend / server, Admin dashboard, Self-hosting / Docker, Not sure]
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and version
      placeholder: iPhone 15, iOS 18.2 · Haki main @ abc1234
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove any personal data first.
