services:
  db:
    image: postgres:15
    container_name: haki_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-haki}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in haki-backend/.env}
      POSTGRES_DB: ${POSTGRES_DB:-haki_db}
      TZ: ${TZ:-UTC}
    command: postgres -c timezone=${TZ:-UTC}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    container_name: haki_api
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - DATABASE_USER=${POSTGRES_USER:-haki}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in haki-backend/.env}
      - DATABASE_NAME=${POSTGRES_DB:-haki_db}
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in haki-backend/.env}
      # Must match the db container: timestamp columns have no zone, so both sides read them in this zone
      - TZ=${TZ:-UTC}
      # iOS push (Apple Developer → Keys → APNs key). Unset = pushes are only logged.
      # - APNS_KEY_ID=ABC123DEFG
      # - APNS_TEAM_ID=XYZ987TEAM
      # - APNS_KEY=-----BEGIN PRIVATE KEY-----\n...\n-----END PRIVATE KEY-----
      # - APNS_TOPIC=com.sleepless_icarus.haki
      # - APNS_PRODUCTION=false
    depends_on:
      - db
    restart: always
    volumes:
      - .:/app
      - /app/node_modules

  dashboard:
    container_name: haki_dashboard
    build: ../haki-dashboard
    ports:
      - "3001:3000"
    depends_on:
      - api
    restart: always

  coturn:
    container_name: haki_coturn
    image: coturn/coturn
    restart: always
    environment:
      - TURNSERVER_REALM=hakirealm
      - TURNSERVER_USER=${TURN_USER:-haki}:${TURN_PASSWORD:?set TURN_PASSWORD in haki-backend/.env}
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "60000-60050:60000-60050/udp"
    volumes:
      - coturn_data:/var/lib/turn

volumes:
  coturn_data:
  postgres_data:
